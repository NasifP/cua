# Thndr X UI calibration.
#
# Partially filled from a screenshot of x.thndr.app. Every value still needs
# checking on YOUR screen, on the screen each control actually lives on:
#
#   python calibrate_ui.py --target host --os macos
#
# prints the labels the live page exposes (read-only: it screenshots and reads,
# never clicks). Order submission stays blocked until calibration_complete = true.

[ui]
# Observed: x.thndr.app/workspaces/default/trade?view=stock
# Left empty on purpose -- navigating means typing into an address bar, which is
# an order-critical primitive on a desktop the bot does not own. Open the page
# yourself and let the bot find it already loaded.
web_url = ""

# Thndr X lists bare EGX tickers (ABUK, NIPH, PHAR) while the price feed and the
# strategy use Yahoo-style ".CA". Every symbol crossing into the UI is stripped,
# and every symbol read back off it is re-tagged.
broker_symbol_suffix = ".CA"

# --- observed in the screenshot -------------------------------------------
positions_tab_label  = "Positions"
orders_tab_label     = "Orders"
market_closed_label  = "Market Closed"

# --- NOT yet confirmed: still placeholders ---------------------------------
# The screenshot showed no visible simulator/virtual badge. Find what Thndr X
# uses to distinguish the paper account from the real one before arming
# anything; if it is not text, the guard needs a different probe. See README.
account_switcher_label  = "Account"
simulator_option_label  = "Simulator"
portfolio_tab_label     = "Portfolio"
search_label            = "Search"
buy_button_label        = "Buy"
sell_button_label       = "Sell"
quantity_field_label    = "Quantity"
limit_price_field_label = "Limit price"
review_button_label     = "Review"
confirm_button_label    = "Confirm"
order_placed_label      = "Order placed"

calibration_complete = false

# The broker's submit button, as [left, top, right, bottom] in SCREEN pixels.
# REQUIRED by --mode live_prepare_only, which fills a real ticket it must never
# commit: the guard refuses every click inside this rectangle, which is what
# turns "the bot does not press Confirm" from a promise into a check. The mode
# refuses to start while this is unset.
#
# How to measure it: open a ticket on the real account, take a screenshot, and
# read the button's bounding box off it. Then GROW IT -- 15-20 px on each side
# is sensible. A fence that is exactly the button fails the first time the
# layout nudges, and it fails in the direction that places an order.
#
# It is coordinates, so it is the one part of this file a redesign invalidates
# silently. Re-measure after any app update before running this mode again.
# submit_button_rect = [300, 840, 560, 920]

# Only for names where the broker's ticker is not just the stripped symbol.
# The gold ETF is the one most likely to need this -- confirm it.
[ui.symbol_overrides]
# "AZG.CA" = "AZGD"
